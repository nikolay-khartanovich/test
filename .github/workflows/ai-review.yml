name: AI Code Review

on:
  push:
  pull_request:

jobs:
  ai-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: AI Review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          pip install requests groq PyGithub
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python .github/workflows/ai_review.py "${{ github.base_ref }}"
          else
            python .github/workflows/ai_review.py
          fi
